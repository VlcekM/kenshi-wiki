name: Wiki staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_preview_url:
        description: 'Verify live only: enter its immutable preview URL. Leave blank for a normal release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check-and-stage:
    if: github.event_name != 'workflow_dispatch' || inputs.verify_preview_url == ''
    outputs:
      version: ${{ steps.preview.outputs.version }}
      url: ${{ steps.preview.outputs.url }}
    concurrency:
      group: wiki-staging-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run staging:dry-run
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm test

      - name: Check that this is still the head of main
        id: main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$head_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit is available. Skipping this deployment."
          fi

      - name: Upload a version for preview
        id: preview
        if: steps.main.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wiki-version.log"
          npm exec -- cf workers versions create --prebuilt --preview-alias staging --tag "${GITHUB_SHA:0:12}" --message "GitHub $GITHUB_SHA" 2>&1 | tee "$log"
          version=$(sed -nE 's/.*Worker Version ID: *([0-9a-f-]{36}).*/\1/p' "$log" | tail -n 1)
          url=$(sed -nE 's/.*Version Preview URL: *(https:[^ ]+).*/\1/p' "$log" | tail -n 1)
          [[ "$version" =~ ^[0-9a-f-]{36}$ && "$url" == "https://${version:0:8}-kenshi-wiki.prds.workers.dev" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview commit $GITHUB_SHA: $url (Worker version $version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Test the uploaded version over HTTPS
        if: steps.preview.outcome == 'success'
        env:
          WIKI_TEST_TARGET: staging
          WIKI_PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: npm test

  promote:
    name: Promote the tested version
    needs: check-and-stage
    if: github.ref == 'refs/heads/main' && needs.check-and-stage.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ needs.check-and-stage.outputs.url }}
    concurrency:
      group: wiki-production
      cancel-in-progress: false
    env:
      WIKI_PREVIEW_URL: ${{ needs.check-and-stage.outputs.url }}
      VERSION: ${{ needs.check-and-stage.outputs.version }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Route production traffic to the approved version
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" != "$GITHUB_SHA" ]]; then
            echo "::error::A newer commit is on main. Review its preview before promoting."
            exit 1
          fi
          versions=$(jq -nc --arg id "$VERSION" '[{version_id:$id,percentage:100}]')
          npm exec -- cf workers deployments create --worker kenshi-wiki --strategy percentage --versions "$versions"
          echo "Deployed $VERSION from $WIKI_PREVIEW_URL to https://kenshi.wiki" >> "$GITHUB_STEP_SUMMARY"

  verify-production:
    name: Verify live wiki
    needs: [check-and-stage, promote]
    if: >-
      always() && !cancelled() &&
      (needs.promote.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.verify_preview_url != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WIKI_TEST_TARGET: production
      WIKI_PREVIEW_URL: ${{ inputs.verify_preview_url || needs.check-and-stage.outputs.url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm exec -- playwright install --with-deps chromium
      - name: Check production in desktop Chromium
        run: xvfb-run -a npm test
