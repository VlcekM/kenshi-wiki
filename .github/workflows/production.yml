name: Promote to production

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wiki-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://kenshi.wiki
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the accepted staging package for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/staging.yml/runs?head_sha=$GITHUB_SHA&branch=main&status=success&per_page=100" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" '[.workflow_runs[] | select((.event == "push" or .event == "workflow_dispatch") and .head_repository.full_name == $repo)] | first | select(. != null) | "\(.id) \(.run_attempt)"')
          if [[ -z "$run" ]]; then
            echo "::error::Wait for Wiki staging to pass on this main commit, then retry."
            exit 1
          fi
          read -r run_id attempt <<< "$run"
          gh run download "$run_id" --name "wiki-package-$attempt" --dir "$RUNNER_TEMP/wiki-release" || {
            echo "::error::Staging package unavailable. Run Wiki staging again on main to create a fresh artifact."
            exit 1
          }
          tar -xzf "$RUNNER_TEMP/wiki-release/wiki-package.tar.gz"
          echo "Staging run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: node scripts/prepare-production.mjs
      - run: npm exec -- cf deploy --prebuilt --dry-run
      - run: npm exec -- playwright install --with-deps chromium

      - name: Deploy the verified package to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NO_COLOR: '1'
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Configure the Cloudflare deploy token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the Cloudflare account ID}"
          npm exec -- cf deploy --prebuilt --no-provision --message "Promote GitHub $GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/wiki-production.log"
          version=$(sed -nE 's/.*Current Version ID:[[:space:]]*([0-9a-fA-F-]{36}).*/\1/p' "$RUNNER_TEMP/wiki-production.log" | tail -n 1)
          test -n "$version"
          printf 'Production Worker version: `%s` · commit `%s`\n' "$version" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production over HTTPS
        env:
          WIKI_TEST_TARGET: production
        run: npm test
